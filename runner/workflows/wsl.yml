# Syncyard wsl workflow - version 0.2.0
# Part of AXIOVEX/syncyard. Dispatch-only by design: this workflow binds
# self-hosted runners and must NEVER be triggered by pull_request,
# pull_request_target, issues, or any other unprivileged event.
# See SECURITY.md - the security model depends on it.
#
# Host contract (spec 010 FR-003/FR-004): a WSL2 venue rides its
# Windows host's runner — this workflow runs on the Windows runner
# addressed by the `lane` input and hops into the host's default
# WSL2 distro. The gatekeeper always passes cwd explicitly (from
# the wsl2 host's config cwd map); the default below is only a
# fallback for manual dispatch.
name: wsl

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Runner lane label (from the gatekeeper's config)"
        required: false
        default: 'lane-long'
      cmd_b64:
        description: "Base64-encoded bash script to execute inside the host's WSL2 distro"
        required: true
      cwd:
        description: "WSL working directory"
        required: false
        default: '/home/tpierson'

jobs:
  wsl:
    runs-on: [self-hosted, "${{ inputs.lane }}"]
    timeout-minutes: 360
    steps:
      - name: Execute-WSL
        shell: pwsh
        env:
          CMD_B64: ${{ inputs.cmd_b64 }}
          WSL_CWD: ${{ inputs.cwd }}
        run: |
          $script = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:CMD_B64))
          $f = Join-Path $env:RUNNER_TEMP 'job.sh'
          [IO.File]::WriteAllText($f, ($script -replace "`r`n","`n"))
          # Manual Windows->WSL path conversion (wslpath strips backslashes via pwsh arg passing)
          $wslPath = '/mnt/' + $f.Substring(0,1).ToLower() + ($f.Substring(2) -replace '\\','/')
          & wsl.exe -- bash -lc "cd '$env:WSL_CWD' && bash '$wslPath'"
          exit $LASTEXITCODE
